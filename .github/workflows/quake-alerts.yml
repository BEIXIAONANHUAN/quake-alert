# 地震预警 · 定时触发 Edge Function
# 监控：每 5 分钟
# 夜报：日本时间错峰（UTC 14:53 / 15:12 / 16:37 / 17:21 / 18:48）
#       ≈ 日本 23:53、次日 0:12、1:37、2:21、3:48
#       函数内用「20 小时窗口」去重，哪班先跑到哪班发，其余自动跳过
name: Quake Alerts Cron

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟实时监控
    # 夜间汇总错峰（UTC）
    - cron: "53 14 * * *"   # 日本 23:53
    - cron: "12 15 * * *"   # 日本 0:12
    - cron: "37 16 * * *"   # 日本 1:37
    - cron: "21 17 * * *"   # 日本 2:21
    - cron: "48 18 * * *"   # 日本 3:48
  workflow_dispatch:
    inputs:
      job:
        description: "手动触发哪一个"
        required: true
        default: "monitor"
        type: choice
        options:
          - monitor
          - nightly
          - both

concurrency:
  group: quake-alerts
  cancel-in-progress: false

jobs:
  monitor:
    name: 实时监控
    if: >
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'monitor' || github.event.inputs.job == 'both'))
      || (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *')
    runs-on: ubuntu-latest
    steps:
      - name: 调用 quake-monitor
        run: |
          curl -sS -X POST "${{ secrets.SUPABASE_FUNCTION_BASE }}/quake-monitor" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions"}' \
            -o /tmp/resp.json -w "HTTP:%{http_code}\n"
          cat /tmp/resp.json || true

  nightly:
    name: 夜间汇总
    if: >
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'nightly' || github.event.inputs.job == 'both'))
      || (github.event_name == 'schedule' && (
           github.event.schedule == '53 14 * * *' ||
           github.event.schedule == '12 15 * * *' ||
           github.event.schedule == '37 16 * * *' ||
           github.event.schedule == '21 17 * * *' ||
           github.event.schedule == '48 18 * * *'
         ))
    runs-on: ubuntu-latest
    steps:
      - name: 调用 nightly-report
        run: |
          curl -sS -X POST "${{ secrets.SUPABASE_FUNCTION_BASE }}/nightly-report" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions"}' \
            -o /tmp/resp.json -w "HTTP:%{http_code}\n"
          cat /tmp/resp.json || true
